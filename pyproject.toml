[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-minimax-h3-speed"
version = "1.0.0"
description = "Adaptive SPEED progressive-resolution sampler for MiniMax-H3 in ComfyUI (Supports Turbo LoRAs & Standard Schedules)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[tool.setuptools.packages.find]
include = ["*"]